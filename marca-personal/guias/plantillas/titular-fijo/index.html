<!doctype html>
<!--
  Plantilla "titular fijo" de la guía de estilo de edición (estilo-de-edicion.md).
  Sale de dos reels de Gonzalo Teba ("Top 10 mejoras de vida" e "Introducción a: El padre más mamado"), mirados el
  3-nov-2026. Es un borrador: falta una tercera referencia del mismo estilo.
  Para usarla: copiar a un proyecto de `hyperframes init`, poner el video de Sergio en #cara (quitar #fondo),
  cambiar el título, las imágenes de la franja de arriba y los subtítulos. Los tiempos van en segundos.
-->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --fondo: #d9d4cc;
        --texto: #ffffff;
        --sombra: 0 3px 10px rgba(0, 0, 0, 0.85);
        --fuente: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--fuente); }
      #cara, #fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #fondo { background: linear-gradient(#6d665d, #3d3833); } /* marcador oscuro; con video, el contorno de los textos los hace leer sobre fondos claros */

      /* Título: queda los primeros segundos arriba, en blanco con sombra, partido en dos líneas. */
      .titulo { position: absolute; top: 150px; left: 0; width: 100%; text-align: center; color: var(--texto); font-weight: 800; text-shadow: var(--sombra); -webkit-text-stroke: 2px #000; paint-order: stroke fill; }
      .titulo .linea1 { font-size: 46px; }
      .titulo .linea2 { font-size: 46px; margin-top: 360px; } /* debajo de la imagen, como en Gonzalo */

      /* Franja de arriba: una imagen por idea, que cambia cada 1 a 4 s, entre el título y la cara. */
      .imagen { position: absolute; top: 210px; left: 90px; width: 900px; height: 340px; border-radius: 6px; overflow: hidden; }
      .imagen div { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; font-weight: 700; }

      /* Subtítulos: chicos, en tipo oración, debajo de la imagen. */
      .sub { position: absolute; top: 570px; left: 0; width: 100%; text-align: center; color: var(--texto); font-size: 34px; font-weight: 600; text-shadow: var(--sombra); -webkit-text-stroke: 2px #000; paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <!-- Con el video de Sergio: <video id="cara" class="clip" data-start="0" data-duration="9" data-track-index="0" src="cara.mp4" muted playsinline></video> -->
      <div id="fondo" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>

      <div id="img1" class="imagen clip" data-start="0" data-duration="4" data-track-index="1"><div style="background: #3a6d8c">imagen del tema</div></div>
      <div id="img2" class="imagen clip" data-start="4" data-duration="2.5" data-track-index="1"><div style="background: #6b4f3a">imagen de la idea 1</div></div>
      <div id="img3" class="imagen clip" data-start="6.5" data-duration="2.5" data-track-index="1"><div style="background: #2f5e3e">imagen de la idea 2</div></div>

      <div id="titulo" class="titulo clip" data-start="0" data-duration="4" data-track-index="2">
        <div class="linea1">Introducción a:</div>
        <div class="linea2">Cómo vendo con IA</div>
      </div>

      <div id="s1" class="sub clip" data-start="4" data-duration="1.3" data-track-index="3">pero de forma realista,</div>
      <div id="s2" class="sub clip" data-start="5.3" data-duration="1.2" data-track-index="3">sin prometer de más</div>
      <div id="s3" class="sub clip" data-start="6.5" data-duration="2.5" data-track-index="3">primero, nunca hagas esto</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Las imágenes entran de golpe, como un corte; el título ya está en el primer cuadro.
      gsap.utils.toArray(".sub").forEach((el) => {
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.08 }, Number(el.dataset.start));
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
